<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nộp bài Speaking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        label {
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            resize: none;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Nộp bài Speaking</h1>
    <form id="submitSpeakingForm">
        <label for="speakingContent">Nội dung bài Speaking (có thể là mô tả hoặc ghi chú):</label>
        <textarea id="speakingContent" name="speakingContent" required></textarea>
        <button type="submit">Nộp bài</button>
    </form>
</div>

<script>
    const jwtToken = localStorage.getItem('jwtToken');
    const urlParams = new URLSearchParams(window.location.search);
    const assignmentId = urlParams.get('assignmentId');

    document.getElementById('submitSpeakingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const content = document.getElementById('speakingContent').value;

        // Nếu bạn muốn gửi audio file thay vì text, cần dùng FormData và input type="file"
        // Ở đây giả sử server chấp nhận nội dung text

        const response = await fetch(`/api/speaking/assignments/${assignmentId}/submit`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${jwtToken}`
            },
            body: JSON.stringify(content)
        });

        if (response.ok) {
            alert('Đã nộp bài Speaking thành công!');
            // Có thể redirect về danh sách bài speaking hoặc trang khác
            window.location.href = '/student/speaking-assignments';
        } else {
            alert('Lỗi khi nộp bài Speaking.');
        }
    });
</script>

</body>
</html>
