<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>IELTS Reading Test</title>

    <!-- ===== CSS ===== -->
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

        /* Navbar */
        .navbar { background: #fff; border-bottom:1px solid #ddd; padding:10px 20px; }
        .navbar-brand { font-weight:bold; color:#1a1a1a; text-decoration:none; }
        .navbar-nav { list-style:none; display:inline-flex; margin-left:20px; }
        .navbar-nav li { margin-right:15px; }
        .navbar-nav li a { text-decoration:none; color:#555; }
        .navbar-nav li.active a { color:#1e90ff; font-weight:bold; }

        /* Main container: two columns */
        .panel-container { display:flex; height: calc(100vh - 160px); }

        /* Left: passage */
        .reading-text { flex:2; background:#fff; padding:20px; overflow-y:auto; border-right:1px solid #ddd; }
        .reading-text h2 { text-align:center; margin-bottom:16px; }
        .reading-text img { display:block; max-width:100%; margin:0 auto 16px; }
        .reading-text p { line-height:1.6; margin-bottom:12px; }

        /* Right: questions */
        .exam-content { flex:1; background:#fafafa; padding:20px; overflow-y:auto; }
        .exam-content h2 { font-size:18px; margin-bottom:12px; border-bottom:2px solid #1e90ff; padding-bottom:6px; }
        .exam-content p, .exam-content li { margin-bottom:8px; line-height:1.4; }
        .exam-content select,
        .exam-content input[type="text"] {
            margin-right:8px; padding:4px 6px; border:1px solid #ccc; border-radius:4px;
        }

        /* Bottom controller */
        .controller-section {
            position:fixed; bottom:0; left:0; right:0;
            background:#fff; border-top:1px solid #ddd;
            padding:10px 20px;
            display:flex; align-items:center; justify-content:space-between;
            box-shadow:0 -2px 6px rgba(0,0,0,0.05); z-index:100;
        }
        .question-buttons { list-style:none; display:flex; gap:6px; }
        .question-buttons li {
            width:32px; height:32px; background:#fff; border:1px solid #ccc;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            cursor:pointer; user-select:none;
        }
        .question-buttons li.answered {
            background:#1e90ff; color:#fff; border-color:#1e90ff;
        }
        .controller-lower .btn {
            padding:6px 14px; border-radius:4px; text-decoration:none; color:#fff; cursor:pointer;
        }
        .btn-success { background:#28a745; }
        .btn-primary { background:#007bff; }
        .btn-warning { background:#ffc107; color:#333; }
        .clock time { font-size:16px; font-weight:bold; color:#1e90ff; margin-left:10px; }

        /* scrollbar */
        .reading-text::-webkit-scrollbar,
        .exam-content::-webkit-scrollbar { width:8px; }
        .reading-text::-webkit-scrollbar-thumb,
        .exam-content::-webkit-scrollbar-thumb {
            background:rgba(0,0,0,0.2); border-radius:4px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="/" class="navbar-brand">Mini-IELTS</a>
    <ul class="navbar-nav">
        <li><a href="/listening">Listening</a></li>
        <li class="active"><a href="/reading">Reading</a></li>
    </ul>
</nav>

<!-- Main panels -->
<div class="panel-container" id="main-panel">
    <div class="reading-text" id="left-panel">
        Loading passage…
    </div>
    <div class="exam-content" id="right-panel">
        Loading questions…
    </div>
</div>

<!-- Bottom controller -->
<div class="controller-section">
    <ul class="question-buttons" id="question-buttons">
        <!-- JS sẽ render số câu -->
    </ul>
    <div class="controller-lower">
        <a class="btn btn-success" id="submit-btn">Submit</a>
        <span class="clock"><time id="timer">00:00</time></span>
    </div>
</div>
<div id="correct-answers" style="display:none;">
</div>
<!-- ===== JS ===== -->
<script>
    // Globals
    const studentAnswers = {};
    let correctAnswers = {};
    const params = new URLSearchParams(window.location.search);
    const idReadingTest = params.get('idTest');

    console.log(idReadingTest);

    document.addEventListener('DOMContentLoaded', async () => {
        const savedUrl = `http://localhost:8080/api/reading/content/${idReadingTest}`;
        if (!savedUrl) {
            alert("Không tìm thấy URL đã lưu. Vui lòng quay lại trang nhập URL.");
            return;
        }

        // 1) Load passage + questions
        await loadExam(`/api/reading/content/${idReadingTest}`);

        // 2) Start timer (ví dụ 20 phút)
        startTimer(20 * 60);

        // 3) Submit handler
        document.getElementById('submit-btn').onclick = submitExam;

        // 4) Lấy đáp án đúng
        const solutionLink = await fetchSolutionLink(savedUrl);
        if (solutionLink) {
            await getCorrectAnswers(solutionLink);
        }
    });

    /** Load HTML từ API, parse passage và các exam-section có câu hỏi */
    async function loadExam(url) {
        try {
            const res = await fetch(url);
            const html = await res.text();
            const tmp = document.createElement('div');
            tmp.innerHTML = html;

            // --- Passage ---
            const left = tmp.querySelector('.reading-text');
            document.getElementById('left-panel').innerHTML =
                left?.innerHTML ?? 'No passage';

            // --- Questions ---
            const rpanel = document.getElementById('right-panel');
            rpanel.innerHTML = ''; // reset trước

            // Lấy tất cả exam-section, chỉ append những section có câu hỏi
            tmp.querySelectorAll('div.exam-section').forEach(sec => {
                // điều kiện section chứa select[id^="q"], input[id^="q"], hoặc radio[name^="q"]
                const hasSelect = sec.querySelector('select[id^="q"]');
                const hasTextIn = sec.querySelector('input[type="text"][id^="q"]');
                const hasRadio = sec.querySelector('input[type="radio"][name^="q"]');
                if (hasSelect || hasTextIn || hasRadio) {
                    rpanel.innerHTML += sec.innerHTML;
                }
            });

            // Khởi tạo lại navigation và event
            initPalette();
        } catch (err) {
            console.error('Load error', err);
            document.getElementById('left-panel').textContent = 'Failed to load passage';
            document.getElementById('right-panel').textContent = 'Failed to load questions';
        }
    }

    /** Tạo navigation palette và gắn sự kiện lưu câu trả lời */
    function initPalette() {
        const buttons = document.getElementById('question-buttons');
        buttons.innerHTML = ''; // xoá nút cũ

        const right = document.getElementById('right-panel');
        // Chọn mọi phần tử câu hỏi: select[id^="q"], input[type=text][id^="q"], input[type=radio][name^="q"]
        const qElems = right.querySelectorAll(
            'select[id^="q"], input[type="text"][id^="q"], input[type="radio"][name^="q"]'
        );

        // Lấy danh sách các số câu, loại bỏ trùng, sort tăng dần
        const qNumbers = Array.from(qElems)
            .map(el => {
                const m = el.id?.match(/^q(\d+)/) || el.name?.match(/^q(\d+)/);
                return m ? parseInt(m[1], 10) : NaN;
            })
            .filter(n => !isNaN(n))
            .filter((v, i, a) => a.indexOf(v) === i)  // dedupe
            .sort((a, b) => a - b);

        // Dựng palette với đúng số câu
        qNumbers.forEach(num => {
            const li = document.createElement('li');
            li.textContent = num;
            li.id = 'navq' + num;
            li.onclick = () => {
                const el = right.querySelector('#q' + num) || right.querySelector(`[name="q${num}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            buttons.appendChild(li);
        });

        // Gắn sự kiện thay đổi cho từng câu
        qElems.forEach(el => {
            const idMatch = el.id?.match(/^q(\d+)/) || el.name?.match(/^q(\d+)/);
            const idx = idMatch ? idMatch[1] : null;
            if (!idx) return;

            if (el.tagName === 'SELECT') {
                el.onchange = () => {
                    studentAnswers[idx] = el.value;
                    document.getElementById('navq' + idx).classList.add('answered');
                };
            } else if (el.type === 'text') {
                el.oninput = () => {
                    studentAnswers[idx] = el.value.trim();
                    document.getElementById('navq' + idx).classList.add('answered');
                };
            } else if (el.type === 'radio') {
                // radio: nhiều nút chia chung name=q<num>
                right.querySelectorAll(`input[name="q${idx}"]`).forEach(r => {
                    r.onchange = () => {
                        const checked = right.querySelector(`input[name="q${idx}"]:checked`);
                        studentAnswers[idx] = checked ? checked.value : '';
                        document.getElementById('navq' + idx).classList.add('answered');
                    };
                });
            }
        });
    }

    /** Fetch solution link từ server */
    async function fetchSolutionLink(savedUrl) {
        try {
            const resp = await fetch(`/api/reading/get-solution-link?url=${encodeURIComponent(savedUrl)}`);
            if (!resp.ok) throw new Error();
            return await resp.text();
        } catch {
            console.error('Failed to fetch solution link');
            return null;
        }
    }

    /** Fetch đáp án đúng từ server */
    async function getCorrectAnswers(solutionLink) {
        try {
            const resp = await fetch(`/api/reading/get-answers?url=${encodeURIComponent(solutionLink)}`);
            if (!resp.ok) throw new Error();
            correctAnswers = await resp.json();
            console.log('Correct Answers:', correctAnswers);
        } catch (e) {
            console.error('Error fetching answers', e);
        }
    }

    /** Khởi động countdown timer */
    function startTimer(duration) {
        let t = duration;
        const disp = document.getElementById('timer');
        const iv = setInterval(() => {
            const m = Math.floor(t / 60), s = t % 60;
            disp.textContent = `${m}`.padStart(2, '0') + ':' + `${s}`.padStart(2, '0');
            if (t-- <= 0) clearInterval(iv);
        }, 1000);
    }

    /** Tính điểm khi submit */
    async function submitExam() {
        const total = Object.keys(correctAnswers).length;
        let correct = 0;

        // Thu thập câu trả lời của sinh viên
        for (const q in correctAnswers) {
            const user = (studentAnswers[q] || '').toLowerCase().trim();
            const ans = (correctAnswers[q] || '').toLowerCase().trim();
            if (user === ans) correct++;
        }

        // Tính điểm phần trăm
        const percentage = Math.round(correct / total * 100);

        // Lấy thời gian làm bài
        const timeTaken = document.getElementById('timer').textContent;
        const userId = localStorage.getItem('userId');

        if (!userId) {
            alert('Không tìm thấy thông tin người dùng.');
            return;
        }

        console.log('User ID:', userId);

        // Convert studentAnswers to the desired format (example of array of objects)
        const formattedAnswers = Object.entries(studentAnswers).map(([questionId, answer]) => ({
            questionId: parseInt(questionId),  // Ensure questionId is a number
            answer: answer
        }));

        // Gửi câu trả lời và điểm tới API
        try {
            const response = await saveStudentAnswers({
                studentId: parseInt(userId),
                answers: formattedAnswers,  // Send the formatted answers
                points: correct,
                totalTime: timeTaken,
                timeToSubmit: new Date().toISOString()  // Thời gian hiện tại
            });

            if (response.ok) {
                alert(`Bạn trả lời đúng ${correct}/${total} câu (${percentage}%)`);
                window.location.href = '/student/home'; // Chuyển hướng sau khi hoàn thành
            } else {
                const errorMessage = response.message || 'Lưu bài thi không thành công.';
                alert(errorMessage);
            }
        } catch (error) {
            console.error('Error occurred while saving the exam:', error);
            alert('Đã có lỗi xảy ra khi lưu bài thi. Vui lòng thử lại.');
        }
    }


    // Hàm gửi câu trả lời tới server
    async function saveStudentAnswers(data) {
        const response = await fetch('/api/student-answer/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
        });
        return response;
    }

</script>

</body>
</html>
