<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Realtime Notification</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #notifications {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .noti {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
    </style>
</head>
<body>
<h2>🔔 Thông báo realtime</h2>
<div id="notifications"></div>

<script>
    const userId = localStorage.getItem('userId'); // Ví dụ userId là "5"
    const socket = new SockJS("http://localhost:8080/ws?userId=" + userId);
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log("✅ CONNECTED", frame);

        // Sub theo user mặc định (không cần thêm userId vào path)
        stompClient.subscribe("/user/queue/notifications", function (message) {
            console.log("📨 Nhận được noti:", message.body);

            const div = document.createElement("div");
            div.className = "noti";
            div.innerText = message.body;
            document.getElementById("notifications").appendChild(div);
        });

    });


</script>
</body>
</html>
