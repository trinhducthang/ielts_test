<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài Đọc theo User</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .user-input {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-input input {
            padding: 8px;
            font-size: 14px;
            width: 200px;
        }

        .user-input button {
            padding: 8px 14px;
            background-color: #1976d2;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .card {
            background-color: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            transition: transform 0.2s ease-in-out;
            font-size: 14px;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 10px;
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 8px;
            line-height: 1.3em;
            height: 2.6em;
            overflow: hidden;
        }

        .card a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin: 25px 0;
            gap: 10px;
        }

        .pagination button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        .pagination span {
            padding: 8px;
            font-size: 14px;
        }

        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>Quản Lý Bài Đọc Theo User</header>

<div class="container">
    <div class="user-input">
    </div>

    <div id="reading-list" class="grid">
        <!-- Các bài đọc sẽ được hiển thị tại đây -->
    </div>

    <div class="pagination">
        <button onclick="loadPage(currentPage - 1)">← Trước</button>
        <span id="page-number">Trang 1</span>
        <button onclick="loadPage(currentPage + 1)">Sau →</button>
    </div>
</div>

<script>
    let currentPage = 0;
    let readingTestIds = [];

    function loadUserReadings() {
        const userId = localStorage.getItem('userId');
        if (!userId) return alert("Vui lòng nhập User ID");

        fetch(`/api/reading/getByUserId/${userId}`)
            .then(response => response.json())
            .then(ids => {
                if (!ids || ids.length === 0) {
                    alert("Không có bài đọc nào cho người dùng này.");
                    document.getElementById('reading-list').innerHTML = '';
                    document.getElementById('page-number').innerText = "Trang 1";
                    return;
                }
                readingTestIds = ids;
                loadPage(0);
            })
            .catch(err => {
                alert("Không thể tải dữ liệu người dùng.");
                console.error(err);
            });
    }
    loadUserReadings()
    function loadPage(page) {
        if (page < 0) return;

        const totalPages = Math.ceil(readingTestIds.length / 10);
        if (page >= totalPages) return;

        const params = new URLSearchParams();
        readingTestIds.forEach(id => params.append("ids", id));
        params.append("page", page);
        params.append("size", 10);

        fetch(`/api/reading/by-ids?${params.toString()}`)
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('reading-list');
                list.innerHTML = '';
                if (!data.content || data.content.length === 0) return;
                data.content.forEach(item => {
                    console.log(item.id)
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${item.urlImage}" alt="${item.title}">
                        <div class="card-body">
                            <h3>${item.title}</h3>
                            <a href="/student/answer/reading?idTest=${item.id}" target="_blank">Làm bài</a>

                        </div>
                    `;
                    list.appendChild(card);
                });

                currentPage = page;
                document.getElementById('page-number').innerText = `Trang ${currentPage + 1}`;
            });
    }
</script>

</body>
</html>
