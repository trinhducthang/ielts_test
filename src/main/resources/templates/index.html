<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <form id="urlForm">
        <input type="text" id="urlInput" placeholder="Nhập URL tại đây..." required>
        <button type="submit">Gửi</button>
    </form>
</div>

<script>
    document.getElementById('urlForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Ngăn không gửi form theo cách truyền thống
        const url = document.getElementById('urlInput').value.trim();
        if (url) {
            localStorage.setItem('savedUrl', url); // Lưu vào localStorage
            window.location.href = '/student/homework'; // Chuyển sang trang khác
        } else {
            alert('Vui lòng nhập URL!');
        }
    });
</script>
</body>
</html>
