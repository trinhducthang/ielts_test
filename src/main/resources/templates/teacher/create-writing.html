<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao bài viết có ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        select, input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        select:focus, input:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        #studentList label {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .alert {
            margin-top: 15px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .small-text {
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Giao bài viết</h2>
    <form id="assignmentForm">
        <textarea id="description" name="description" placeholder="Nội dung bài viết" required></textarea>
        <input type="date" id="dueDate" name="dueDate" placeholder="Ngày hết hạn">

        <!-- Chọn lớp -->
        <select id="courseSelect" required>
            <option value="">Chọn lớp học</option>
        </select>

        <!-- Danh sách học sinh -->
        <div id="studentList"></div>

        <!-- URL ảnh -->
        <input type="text" id="imageUrl" name="imageUrl" placeholder="URL ảnh minh họa" required>

        <button type="submit">Giao bài</button>
    </form>

    <div class="alert" id="alertMessage">Giao bài thành công!</div>

    <p class="small-text">Chỉ giáo viên mới được giao bài. Lựa chọn lớp học và học sinh trước khi giao.</p>
</div>

<script>
    const jwtToken = localStorage.getItem('jwtToken');

    // Load danh sách lớp khi mở trang
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/courses', {
                headers: {
                    'Authorization': `Bearer ${jwtToken}`
                }
            });
            const courses = await response.json();
            const courseSelect = document.getElementById('courseSelect');
            courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.id;
                option.textContent = course.name;
                courseSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Không thể tải lớp học:', error);
        }
    });

    // Khi chọn lớp → lấy danh sách học sinh
    document.getElementById('courseSelect').addEventListener('change', async function () {
        const courseId = this.value;
        const studentListDiv = document.getElementById('studentList');
        studentListDiv.innerHTML = '';

        if (!courseId) return;

        try {
            const response = await fetch(`/courses/${courseId}/students`, {
                headers: {
                    'Authorization': `Bearer ${jwtToken}`
                }
            });

            const students = await response.json();

            if (students.length === 0) {
                studentListDiv.innerHTML = '<em>Không có học sinh trong lớp này.</em>';
            } else {
                students.forEach(student => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" value="${student.id}" class="studentCheckbox"> ${student.fullName || 'Học sinh #' + student.id}`;
                    studentListDiv.appendChild(label);
                });
            }
        } catch (error) {
            console.error('Không thể tải học sinh:', error);
        }
    });

    // Xử lý submit
    document.getElementById('assignmentForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const selectedStudentIds = Array.from(document.querySelectorAll('.studentCheckbox:checked')).map(cb => cb.value);

        if (selectedStudentIds.length === 0) {
            alert("Vui lòng chọn ít nhất một học sinh.");
            return;
        }

        const assignmentData = {
            description: document.getElementById('description').value,
            dueDate: document.getElementById('dueDate').value || null,
            assignedUserIds: selectedStudentIds,
            imageUrl: document.getElementById('imageUrl').value
        };

        try {
            const response = await fetch('/api/assignments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify(assignmentData)
            });

            const alertMessage = document.getElementById('alertMessage');

            if (response.ok) {
                const result = await response.text();
                alertMessage.textContent = result || 'Giao bài thành công!';
                alertMessage.style.backgroundColor = '#28a745';
            } else {
                const error = await response.text();
                alertMessage.textContent = error || 'Giao bài thất bại!';
                alertMessage.style.backgroundColor = '#dc3545';
            }

            alertMessage.style.display = 'block';
            setTimeout(() => {
                alertMessage.style.display = 'none';
            }, 3000);
        } catch (error) {
            console.error('Lỗi khi gửi bài:', error);
        }
    });
</script>

</body>
</html>
