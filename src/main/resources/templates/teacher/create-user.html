<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Internal User - Admin Only</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error, .success {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create User (Admin Only)</h2>

    <div id="messages"></div>

    <form id="createUserForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password">
        <input type="text" id="fullName" placeholder="Full Name">
        <select id="role" required>
            <option value="">-- Select Role --</option>
            <option value="TEACHER">Teacher</option>
            <option value="STUDENT">Student</option>
        </select>
        <button type="submit">Create User</button>
    </form>
</div>

<script>
    // Giả lập kiểm tra admin - thay thế bằng logic thực tế
    const isAdmin = true; // TODO: Replace with real authentication check
    const jwtToken = localStorage.getItem('jwtToken');// Giả sử token lưu ở đây

    if (!isAdmin || !jwtToken) {
        document.querySelector('.container').innerHTML = "<h3 style='color:red;'>Access Denied: Admins only.</h3>";
    }

    document.getElementById('createUserForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('fullName').value;
        const role = document.getElementById('role').value;

        const data = { username, password, fullName, role };

        try {
            const response = await fetch('/api/users/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageBox = document.getElementById('messages');

            if (response.ok && result.code === 200) {
                messageBox.innerHTML = `<div class="success">${result.message}</div>`;
                document.getElementById('createUserForm').reset();
            } else {
                messageBox.innerHTML = `<div class="error">${result.message || "Error creating user."}</div>`;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('messages').innerHTML = `<div class="error">Network error</div>`;
        }
    });
</script>

</body>
</html>
