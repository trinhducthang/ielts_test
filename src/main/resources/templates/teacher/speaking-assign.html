<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giao bài Speaking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        select,
        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        #studentList label {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .alert {
            margin-top: 15px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .small-text {
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            color: #777;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #fff;
            height: 100vh;
            padding-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            background-color: #34495e;
            border-top: 1px solid #2c3e50;
        }

        .menu-item:hover {
            background-color: #1abc9c;
        }

        .submenu {
            display: none;
            background-color: #3c5a72;
        }

        .submenu a {
            display: block;
            padding: 10px 40px;
            color: #ecf0f1;
            text-decoration: none;
        }

        .submenu a:hover {
            background-color: #16a085;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            padding-left: 250px; /* Đẩy nội dung chính sang phải để không bị che bởi sidebar */
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>Menu</h2>

    <div class="menu-item" onclick="toggleSubmenu('userSubmenu')">Quản lí user</div>
    <div id="userSubmenu" class="submenu">
        <a href="/teacher/course-management">Quản lí lớp học</a>
        <a href="/teacher/user-management">Quản lí user</a>
    </div>

    <div class="menu-item" onclick="toggleSubmenu('writingSubmenu')">Writing Skill</div>
    <div id="writingSubmenu" class="submenu">
        <a href="/teacher/create-writing">Giao bài viết</a>
        <a href="/teacher/give-feedback">Nhận xét bài viết</a>
    </div>

    <div class="menu-item" onclick="toggleSubmenu('speakingSubmenu')">Speaking Skill</div>
    <div id="speakingSubmenu" class="submenu">
        <a href="#">Giao bài Speaking</a>
        <a href="#">Nhận xét bài Speaking</a>
    </div>

    <div class="menu-item" onclick="toggleSubmenu('readingSubmenu')">Reading Skill</div>
    <div id="readingSubmenu" class="submenu">
        <a href="/teacher/reading-test">Giao bài Reading</a>
    </div>
</div>

<div class="container">
    <h2>Giao bài Speaking</h2>
    <form id="speakingAssignmentForm">
        <textarea id="description" name="description" placeholder="Mô tả bài Speaking" required></textarea>
        <input type="date" id="dueDate" name="dueDate" placeholder="Ngày hết hạn" />

        <!-- Chọn lớp -->
        <select id="courseSelect" required>
            <option value="">Chọn lớp học</option>
        </select>

        <!-- Danh sách học sinh -->
        <div id="studentList"></div>

        <button type="submit">Giao bài</button>
    </form>

    <div class="alert" id="alertMessage">Giao bài thành công!</div>

    <p class="small-text">
        Chỉ giáo viên mới được giao bài. Lựa chọn lớp học và học sinh trước khi giao.
    </p>
</div>

<script>
    function toggleSubmenu(id) {
        const submenu = document.getElementById(id);
        submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }
    const jwtToken = localStorage.getItem("jwtToken");

    // Load danh sách lớp khi mở trang
    window.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch("/courses", {
                headers: {
                    Authorization: `Bearer ${jwtToken}`,
                },
            });
            const courses = await response.json();
            const courseSelect = document.getElementById("courseSelect");
            courses.forEach((course) => {
                const option = document.createElement("option");
                option.value = course.id;
                option.textContent = course.name;
                courseSelect.appendChild(option);
            });
        } catch (error) {
            console.error("Không thể tải lớp học:", error);
        }
    });

    // Khi chọn lớp → lấy danh sách học sinh
    document.getElementById("courseSelect").addEventListener("change", async function () {
        const courseId = this.value;
        const studentListDiv = document.getElementById("studentList");
        studentListDiv.innerHTML = "";

        if (!courseId) return;

        try {
            const response = await fetch(`/courses/${courseId}/students`, {
                headers: {
                    Authorization: `Bearer ${jwtToken}`,
                },
            });

            const students = await response.json();

            if (students.length === 0) {
                studentListDiv.innerHTML = "<em>Không có học sinh trong lớp này.</em>";
            } else {
                students.forEach((student) => {
                    const label = document.createElement("label");
                    label.innerHTML = `<input type="checkbox" value="${student.id}" class="studentCheckbox"> ${
                        student.fullName || "Học sinh #" + student.id
                    }`;
                    studentListDiv.appendChild(label);
                });
            }
        } catch (error) {
            console.error("Không thể tải học sinh:", error);
        }
    });

    // Xử lý submit
    document.getElementById("speakingAssignmentForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const selectedStudentIds = Array.from(document.querySelectorAll(".studentCheckbox:checked")).map(
            (cb) => cb.value
        );

        if (selectedStudentIds.length === 0) {
            alert("Vui lòng chọn ít nhất một học sinh.");
            return;
        }

        const assignmentData = {
            description: document.getElementById("description").value,
            dueDate: document.getElementById("dueDate").value || null,
            assignedUserIds: selectedStudentIds.map((id) => parseInt(id, 10)), // convert to Long/Number
        };

        try {
            const response = await fetch("/api/speaking/assignments", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${jwtToken}`,
                },
                body: JSON.stringify(assignmentData),
            });

            const alertMessage = document.getElementById("alertMessage");

            if (response.ok) {
                const result = await response.text();
                alertMessage.textContent = result || "Giao bài thành công!";
                alertMessage.style.backgroundColor = "#28a745";
            } else {
                const error = await response.text();
                alertMessage.textContent = error || "Giao bài thất bại!";
                alertMessage.style.backgroundColor = "#dc3545";
            }

            alertMessage.style.display = "block";
            setTimeout(() => {
                alertMessage.style.display = "none";
            }, 3000);
        } catch (error) {
            console.error("Lỗi khi gửi bài:", error);
        }
    });
</script>
</body>
</html>
