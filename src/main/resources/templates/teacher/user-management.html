<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - User List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            max-width: 1000px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2, h3 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .error {
            color: red;
            text-align: center;
        }

        .success {
            color: green;
            text-align: center;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        button.action {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
        }

        .update-btn {
            background-color: #f39c12;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .update-btn:hover {
            background-color: #d68910;
        }

        #registrationForm {
            margin-top: 30px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        #registrationForm button {
            padding: 10px;
            width: 48%;
            margin-right: 2%;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        #showFormBtn {
            float: right;
            margin-bottom: 10px;
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>User Management</h2>
    <div id="message" class="error"></div>

    <button id="showFormBtn" class="update-btn">➕ Create account</button>

    <table id="userTable" style="display: none;">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>

    <div class="pagination">
        <button id="prevBtn" disabled>Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Next</button>
    </div>

    <!-- Registration Form -->
    <div id="registrationForm" style="display: none;">
        <h3>Create account</h3>
        <form id="createUserForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="fullName" placeholder="Full name">
            <select id="role" required>
                <option value="">-- Select role --</option>
                <option value="TEACHER">Teacher</option>
                <option value="STUDENT">Student</option>
            </select>
            <div class="form-buttons">
                <button type="submit" style="background-color:#007bff;">Create</button>
                <button type="button" id="cancelBtn" style="background-color:gray;">Cancle</button>
            </div>
            <div id="formMessage"></div>
        </form>
    </div>
</div>

<script>
    const token = localStorage.getItem("jwtToken");
    const isAdmin = true;

    const messageEl = document.getElementById("message");
    const table = document.getElementById("userTable");
    const tbody = document.getElementById("userTableBody");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    const showFormBtn = document.getElementById("showFormBtn");
    const registrationForm = document.getElementById("registrationForm");
    const cancelBtn = document.getElementById("cancelBtn");
    const formMsg = document.getElementById("formMessage");

    let currentPage = 0;
    const pageSize = 5;

    if (!token || !isAdmin) {
        messageEl.textContent = "Access denied. Admins only.";
    } else {
        loadPage(currentPage);
    }

    function loadPage(page) {
        fetch(`/api/users?page=${page}&size=${pageSize}`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(async res => {
                if (!res.ok) throw new Error("Unauthorized or failed to load.");
                const data = await res.json();

                tbody.innerHTML = "";
                data.content.forEach(user => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.fullName || '-'}</td>
                    <td>${user.role}</td>
                    <td>
                        <button class="action delete-btn" onclick="deleteUser(${user.id})">🗑 Delete</button>
                        <button class="action update-btn" onclick="updatePassword('${user.username}')">✏ Update pass</button>
                    </td>
                `;
                    tbody.appendChild(row);
                });

                table.style.display = "table";
                pageInfo.textContent = `Trang ${data.number + 1} / ${data.totalPages}`;
                prevBtn.disabled = data.first;
                nextBtn.disabled = data.last;
                currentPage = data.number;
            })
            .catch(err => {
                console.error(err);
                messageEl.textContent = "Lỗi khi tải dữ liệu người dùng.";
            });
    }

    prevBtn.addEventListener("click", () => {
        if (currentPage > 0) loadPage(currentPage - 1);
    });

    nextBtn.addEventListener("click", () => {
        loadPage(currentPage + 1);
    });

    function deleteUser(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa người dùng này?")) return;

        fetch(`/api/users/info?id=${id}`, {
            method: "DELETE",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadPage(currentPage);
            })
            .catch(err => {
                console.error(err);
                alert("Xóa thất bại.");
            });
    }

    function updatePassword(username) {
        const newPassword = prompt(`Nhập mật khẩu mới cho ${username}:`);
        if (!newPassword) return;

        fetch(`/api/users/updatePassword/${username}?password=${encodeURIComponent(newPassword)}`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
            })
            .catch(err => {
                console.error(err);
                alert("Cập nhật mật khẩu thất bại.");
            });
    }

    // Form show/hide
    showFormBtn.addEventListener("click", () => {
        registrationForm.style.display = "block";
        showFormBtn.style.display = "none";
    });

    cancelBtn.addEventListener("click", () => {
        registrationForm.style.display = "none";
        showFormBtn.style.display = "inline-block";
        formMsg.textContent = "";
        document.getElementById("createUserForm").reset();
    });

    // Form submit
    document.getElementById('createUserForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('fullName').value;
        const role = document.getElementById('role').value;

        const data = { username, password, fullName, role };

        try {
            const response = await fetch('/api/users/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok && result.code === 200) {
                formMsg.className = 'success';
                formMsg.textContent = result.message;
                loadPage(currentPage);
                setTimeout(() => {
                    registrationForm.style.display = "none";
                    showFormBtn.style.display = "inline-block";
                    document.getElementById('createUserForm').reset();
                    formMsg.textContent = "";
                }, 2000);
            } else {
                formMsg.className = 'error';
                formMsg.textContent = result.message || 'Tạo tài khoản thất bại.';
            }
        } catch (err) {
            console.error(err);
            formMsg.className = 'error';
            formMsg.textContent = 'Lỗi kết nối hoặc máy chủ.';
        }
    });
</script>

</body>
</html>
