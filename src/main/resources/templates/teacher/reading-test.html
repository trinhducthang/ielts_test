<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giao bài Reading (upload file)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding-left: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        select,
        input[type="text"],
        input[type="date"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: #f9f9f9;
        }
        select:focus,
        input:focus,
        textarea:focus,
        input[type="file"]:focus {
            border-color: #3498db;
            outline: none;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        #studentList label {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .alert {
            margin-top: 15px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .alert.error {
            background-color: #dc3545;
        }
        .small-text {
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Giao bài Reading (upload file PDF & Excel)</h2>
    <form id="readingAssignmentForm" enctype="multipart/form-data">
        <select id="courseSelect" required>
            <option value="">Chọn lớp học</option>
        </select>

        <div id="studentList"><em>Chọn lớp để hiển thị học sinh</em></div>

        <textarea id="description" name="description" placeholder="Mô tả bài đọc" required></textarea>

        <label for="pdfFile">Chọn file PDF bài đọc:</label>
        <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" required />

        <label for="excelFile">Chọn file Excel đáp án:</label>
        <input type="file" id="excelFile" name="excelFile" accept=".xlsx, .xls" required />

        <input type="date" id="dueDate" name="dueDate" required />

        <button type="submit">Giao bài</button>
    </form>

    <div class="alert" id="alertMessage"></div>
    <p class="small-text">Chỉ giáo viên mới có thể giao bài. Vui lòng chọn lớp, học sinh và nhập đầy đủ thông tin.</p>
</div>

<script>
    const jwtToken = localStorage.getItem('jwtToken');

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/courses', {
                headers: { Authorization: `Bearer ${jwtToken}` }
            });
            const courses = await res.json();

            const courseSelect = document.getElementById('courseSelect');
            courses.forEach(course => {
                const opt = document.createElement('option');
                opt.value = course.id;
                opt.textContent = course.name;
                courseSelect.appendChild(opt);
            });
        } catch (err) {
            console.error('Lỗi tải lớp:', err);
        }
    });

    document.getElementById('courseSelect').addEventListener('change', async function () {
        const courseId = this.value;
        const studentListDiv = document.getElementById('studentList');
        studentListDiv.innerHTML = '';

        if (!courseId) {
            studentListDiv.innerHTML = '<em>Chọn lớp để hiển thị học sinh</em>';
            return;
        }

        try {
            const res = await fetch(`/courses/${courseId}/students`, {
                headers: { Authorization: `Bearer ${jwtToken}` }
            });
            const students = await res.json();

            if (students.length === 0) {
                studentListDiv.innerHTML = '<em>Không có học sinh trong lớp này.</em>';
            } else {
                students.forEach(s => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" value="${s.id}" class="studentCheckbox" /> ${s.fullName || 'Học sinh #' + s.id}`;
                    studentListDiv.appendChild(label);
                });
            }
        } catch (err) {
            console.error('Lỗi tải học sinh:', err);
            studentListDiv.innerHTML = '<em>Lỗi tải học sinh</em>';
        }
    });

    document.getElementById('readingAssignmentForm').addEventListener('submit', async e => {
        e.preventDefault();

        const selectedStudentIds = Array.from(document.querySelectorAll('.studentCheckbox:checked')).map(cb => cb.value);
        if (selectedStudentIds.length === 0) {
            alert('Vui lòng chọn ít nhất một học sinh.');
            return;
        }

        const courseId = document.getElementById('courseSelect').value;
        if (!courseId) {
            alert('Vui lòng chọn lớp học.');
            return;
        }

        const form = e.target;
        const formData = new FormData(form);
        formData.append('assignedUserIds', JSON.stringify(selectedStudentIds));
        formData.append('courseId', courseId);

        const alertMessage = document.getElementById('alertMessage');

        try {
            const res = await fetch('/api/reading/assignments', {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${jwtToken}`
                },
                body: formData
            });

            if (res.ok) {
                alertMessage.textContent = 'Giao bài Reading thành công!';
                alertMessage.className = 'alert';
                alertMessage.style.display = 'block';
                form.reset();
                document.getElementById('studentList').innerHTML = '<em>Chọn lớp để hiển thị học sinh</em>';
            } else {
                const errText = await res.text();
                alertMessage.textContent = `Giao bài thất bại: ${errText || res.statusText}`;
                alertMessage.className = 'alert error';
                alertMessage.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            alertMessage.textContent = 'Lỗi khi gửi bài. Vui lòng thử lại.';
            alertMessage.className = 'alert error';
            alertMessage.style.display = 'block';
        }

        setTimeout(() => {
            alertMessage.style.display = 'none';
        }, 4000);
    });
</script>
</body>
</html>
