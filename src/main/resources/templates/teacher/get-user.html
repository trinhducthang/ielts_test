<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - User List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            max-width: 1000px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .error {
            color: red;
            text-align: center;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        button.action {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
        }

        .update-btn {
            background-color: #f39c12;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .update-btn:hover {
            background-color: #d68910;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Dashboard - User Management</h2>
    <div id="message" class="error"></div>

    <table id="userTable" style="display: none;">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>

    <div class="pagination">
        <button id="prevBtn" disabled>Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Next</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("jwtToken"); // Replace with actual logic
    const isAdmin = true; // Replace with actual role check

    const messageEl = document.getElementById("message");
    const table = document.getElementById("userTable");
    const tbody = document.getElementById("userTableBody");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    let currentPage = 0;
    const pageSize = 5;

    if (!token || !isAdmin) {
        messageEl.textContent = "Access denied. Admins only.";
    } else {
        loadPage(currentPage);
    }

    function loadPage(page) {
        fetch(`/api/users?page=${page}&size=${pageSize}`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(async res => {
                if (!res.ok) throw new Error("Unauthorized or failed to load.");
                const data = await res.json();

                tbody.innerHTML = "";
                data.content.forEach(user => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.fullName || '-'}</td>
                    <td>${user.role}</td>
                    <td>
                        <button class="action delete-btn" onclick="deleteUser(${user.id})">🗑 Delete</button>
                        <button class="action update-btn" onclick="updatePassword('${user.username}')">✏ Update</button>
                    </td>
                `;
                    tbody.appendChild(row);
                });

                table.style.display = "table";
                pageInfo.textContent = `Page ${data.number + 1} of ${data.totalPages}`;
                prevBtn.disabled = data.first;
                nextBtn.disabled = data.last;
                currentPage = data.number;
            })
            .catch(err => {
                console.error(err);
                messageEl.textContent = "Failed to fetch user data.";
            });
    }

    prevBtn.addEventListener("click", () => {
        if (currentPage > 0) loadPage(currentPage - 1);
    });

    nextBtn.addEventListener("click", () => {
        loadPage(currentPage + 1);
    });

    function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;

        fetch(`/api/users/info?id=${id}`, {
            method: "DELETE",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadPage(currentPage);
            })
            .catch(err => {
                console.error(err);
                alert("Failed to delete user.");
            });
    }

    function updatePassword(username) {
        const newPassword = prompt(`Enter new password for ${username}:`);
        if (!newPassword) return;

        fetch(`/api/users/updatePassword/${username}?password=${encodeURIComponent(newPassword)}`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
            })
            .catch(err => {
                console.error(err);
                alert("Failed to update password.");
            });
    }
</script>

</body>
</html>
